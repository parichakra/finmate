# NOTE: this machine has only ~12GB RAM. The previous -Xmx8G/-MaxMetaspaceSize=4G
# (~12.5GB claimed) left too little memory for the separate Kotlin daemon, which made
# it fail to close memory-mapped .tab caches -> "Daemon compilation failed".
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Skip Kotlin incremental compilation: the caches-jvm/*.tab close was the exact
# failure point ("Could not close incremental caches ... source-to-classes.tab").
kotlin.incremental=false
# Keep the Kotlin daemon but bound its heap so it can't starve or thrash.
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
