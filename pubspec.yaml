name: finmate
description: "A Finanancial Expenses tracking Application."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0

  # Database
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation & Utils
  go_router: ^14.6.2
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.19.0

  # Optional
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
